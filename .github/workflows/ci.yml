name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agenda
          POSTGRES_USER: agenda
          POSTGRES_PASSWORD: agenda
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agenda -d agenda"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://agenda:agenda@localhost:5432/agenda?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @agenda/api db:generate

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      # Fase 2: migrations num banco limpo + testes de integração no Postgres do service.
      - run: pnpm --filter @agenda/api db:migrate

      - run: pnpm --filter @agenda/api test:integration

      # Fase 3: seed (2×, idempotente) e a API de pé respondendo /docs-json.
      - run: pnpm --filter @agenda/api db:seed && pnpm --filter @agenda/api db:seed

      - name: API sobe e publica o OpenAPI
        env:
          LEMBRETES_ATIVOS: 'false'
        run: |
          pnpm --filter @agenda/api start > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3333/health && break; sleep 1; done
          curl -sf http://localhost:3333/docs-json | grep -q '"/auth/login"'
          curl -sf -X POST http://localhost:3333/auth/login -H 'content-type: application/json' \
            -d '{"email":"dono@agenda.dev","senha":"demo1234"}' | grep -q '"token"'

      # Fase 5: E2E do front (Playwright no Chrome do runner). Sobe a API (:3334, banco agenda_e2e
      # com migrate deploy + seed) e o web (next build + start, :3100) sozinho.
      - name: E2E do front
        run: pnpm test:e2e
